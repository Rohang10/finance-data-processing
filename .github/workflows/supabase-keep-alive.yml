name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs at 04:00 UTC every 2 days (well within Supabase's 7-day inactivity pause limit)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

# Prevent concurrent runs of the keep-alive workflow
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: Run Database Keep-Alive Query
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST || 'aws-1-ap-south-1.pooler.supabase.com' }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT || '6543' }}
          DB_NAME: ${{ secrets.DB_NAME || vars.DB_NAME || 'postgres' }}
          DB_USER: ${{ secrets.DB_USER || vars.DB_USER || 'postgres.mywkniiuvjwmsmhbbrfx' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD || 'rohang@1003' }}
          DB_SSL: 'true'
        run: node scripts/keep-alive.js
